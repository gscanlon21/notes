
<script src="{{ get_url(path="/scripts/birds/p5.min.js", cachebust=true) }}"></script>
<script src="{{ get_url(path="/scripts/birds/three.r95.min.js", cachebust=true) }}"></script>
<script src="{{ get_url(path="/scripts/birds/vanta.birds.min.js", cachebust=true) }}"></script>

<div id="birds"></div>
<script>
	const STORAGE_KEY = "vanta-birds-options";

	let options = JSON.parse(localStorage.getItem(STORAGE_KEY));
	if (options && options.enabledCheckbox) {
		console.debug(options);

		options.color1 = parseInt(options.color1.substring(1), 16);
    	options.color2 = parseInt(options.color2.substring(1), 16);

		const effect = VANTA.BIRDS({
			touchControls: false,
			mouseControls: false,
			backgroundAlpha: 0,
			el: "#birds",
			...options,
		});

		function livelyPropertyListener(name, val) {
			if (name == "quantity") {
				effect.setOptions({
					quantity: val
				});
				// Need to restart twice for colors to take effect.
				effect.restart();
				effect.restart();
			}
			else if (name == "birdSize") {
				effect.setOptions({
					birdSize: val
				});
				effect.restart();
			}
			else if (name == "wingSpan") {
				effect.setOptions({
					wingSpan: val
				});
				effect.restart();
			}
			else if (name == "speedLimit") {
				effect.setOptions({
					speedLimit: val
				});
				effect.valuesChanger();
			}
			else if (name == "separation") {
				effect.setOptions({
					separation: val
				});
				effect.valuesChanger();
			}
			else if (name == "alignment") {
				effect.setOptions({
					alignment: val
				});
				effect.valuesChanger();
			}
			else if (name == "cohesion") {
				effect.setOptions({
					cohesion: val
				});
				effect.valuesChanger();
			}
			else if (name == "backgroundColor") {
				effect.setOptions({
					backgroundColor: parseInt(val.substring(1), 16)
				});
			}
			else if (name == "color1") {
				effect.setOptions({
					color1: parseInt(val.substring(1), 16)
				});
				effect.restart();
			}
			else if (name == "color2") {
				effect.setOptions({
					color2: parseInt(val.substring(1), 16)
				});
				effect.restart();
			}
			else if (name == "colorMode") {
				if (val == 0) {
					effect.setOptions({
						colorMode: "lerp"
					});
				}
				else if (val == 1) {
					effect.setOptions({
						colorMode: "variance"
					});
				}
				else if (val == 2) {
					effect.setOptions({
						colorMode: "lerpGradient"
					});
				}
				else if (val == 3) {
					effect.setOptions({
						colorMode: "varianceGradient"
					});
				}
				effect.restart();
			}
		}
	}
</script>
